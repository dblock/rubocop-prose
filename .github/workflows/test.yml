name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.2', rubocop: '~> 1.72', suite: unit }
          - { ruby: '3.2', rubocop: '~> 1.72', suite: 'integration:markdown' }
          - { ruby: '3.2', rubocop: '~> 1.72', suite: 'integration:prose_and_text' }
          - { ruby: '4.0', rubocop: '~> 1.72', suite: unit }
          - { ruby: '4.0', rubocop: '~> 1.72', suite: 'integration:markdown' }
          - { ruby: '4.0', rubocop: '~> 1.72', suite: 'integration:prose_and_text' }
    name: test (Ruby ${{ matrix.entry.ruby }}, RuboCop ${{ matrix.entry.rubocop }}, ${{ matrix.entry.suite }})
    env:
      RUBOCOP_VERSION: ${{ matrix.entry.rubocop }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec:${{ matrix.entry.suite }}
      - run: bundle exec rake build
