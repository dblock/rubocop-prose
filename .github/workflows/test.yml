name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.2', rubocop: '~> 1.72', suite: unit }
          - { ruby: '3.2', rubocop: '~> 1.72', suite: integration }
          - { ruby: '4.0', rubocop: '~> 1.72', suite: unit }
          - { ruby: '4.0', rubocop: '~> 1.72', suite: integration }
    name: test (Ruby ${{ matrix.entry.ruby }}, RuboCop ${{ matrix.entry.rubocop }}, ${{ matrix.entry.suite }})
    env:
      RUBOCOP_VERSION: ${{ matrix.entry.rubocop }}
      COVERAGE: ${{ matrix.entry.ruby == '4.0' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec:${{ matrix.entry.suite }}
      - run: bundle exec rake build
      - uses: coverallsapp/github-action@v2
        if: matrix.entry.ruby == '4.0'
        with:
          file: coverage/.resultset.json
          format: simplecov
          flag-name: ${{ matrix.entry.suite }}
          parallel: true
  coverage:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
