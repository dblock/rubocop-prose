name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
        rubocop: ['~> 1.72']
        include:
          - ruby: '3.2'
            rubocop: '1.72.1'
    env:
      RUBOCOP_VERSION: ${{ matrix.rubocop }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rake build
  markdown-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: rubocop/rubocop-md
          ref: refs/pull/57/head
          path: tmp/rubocop-md
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rspec spec/integration/markdown_interoperability_spec.rb
        env:
          RUBOCOP_MD_PATH: ${{ github.workspace }}/tmp/rubocop-md
