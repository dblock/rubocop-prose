plugins:
  - rubocop-prose

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'spec/fixtures/**/*'
    - 'LICENSE.txt'

Style/Documentation:
  Enabled: false

Naming/FileName:
  Exclude:
    - 'lib/rubocop-prose.rb'

Metrics:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'
