inherit_mode:
  merge:
    - Exclude
    - Expectations

plugins:
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'spec/fixtures/**/*'
    - 'LICENSE.txt'

Style/Documentation:
  Enabled: false

Markdown/HeadingCapitalization:
  Enabled: true
  IgnoredWords:
    - rubocop
    - prose

Prose/SentenceCapitalization:
  Enabled: true
  IgnoredWords:
    - rubocop
    - prose

Markdown/ListItemCapitalization:
  Enabled: true

Markdown/ListMarkerSpacing:
  EnforcedStyle: aligned

Markdown/FrontMatterKeys:
  Enabled: true

Markdown/BareUrl:
  Enabled: true

Markdown/CodeBlockStyle:
  Enabled: true
  EnforcedStyle: fenced

Markdown/EmphasisHeading:
  Enabled: true

Markdown/FirstHeading:
  Enabled: true
  Exclude:
    - 'README.md'

Markdown/HeadingPunctuation:
  Enabled: true

Markdown/HeadingStyle:
  Enabled: true
  EnforcedStyle: atx

Markdown/LinkFragment:
  Enabled: true

Markdown/LinkStyle:
  Enabled: true

Markdown/ListItemPunctuation:
  Enabled: true

Markdown/OrderedListNumbering:
  Enabled: true

Markdown/ProperNames:
  Enabled: true
  Names:
    - GitHub
    - Markdown
    - RuboCop
    - Ruby
    - YAML

Markdown/RawHtml:
  Enabled: true
  AllowedElements:
    - img:
        - src
        - alt
        - width

Markdown/SingleTopLevelHeading:
  Enabled: true

Markdown/StructuralLineLength:
  Enabled: true
  Max: 120

Naming/FileName:
  Exclude:
    - 'lib/rubocop-prose.rb'

Metrics:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

RSpec:
  Language:
    Expectations:
      - run_fixture

# Regression examples keep related diagnostic and correction assertions together.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

# Cop specs deliberately use a flat spec/<cop>_spec.rb layout.
RSpec/SpecFilePathFormat:
  Enabled: false

# These exercise end-to-end behavior rather than one class.
RSpec/DescribeClass:
  Exclude:
    - 'spec/integration/**/*'
    - 'spec/interoperability/**/*'
    - 'spec/benchmark_spec.rb'
    - 'spec/front_matter_spec.rb'
    - 'spec/text_spec.rb'
