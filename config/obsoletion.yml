renamed:
  Markdown/HardTabs: Prose/HardTabs
  Markdown/ProperNames: Prose/ProperNames

changed_parameters:
  - cops: Markdown/StructuralLineLength
    parameters:
      - Max
      - HeadingMax
      - CodeBlockMax
    reason: >-
      Replace the shared limit and enable/value pairs with a positive integer width (or false) for each element:
      Headings, CodeBlocks, and Tables. For example, use Headings: 120, CodeBlocks: false, and Tables: false.
  - cops: Markdown/ReferenceDefinitions
    parameters:
      - CheckDuplicates
      - AllowIdenticalDuplicates
    reason: >-
      Replace CheckDuplicates and AllowIdenticalDuplicates with Duplicates.
      CheckDuplicates: false maps to Duplicates: allow, regardless of AllowIdenticalDuplicates.
      CheckDuplicates: true (or omitted) with AllowIdenticalDuplicates: true maps to Duplicates: allow_identical.
      Otherwise, the default maps to Duplicates: forbid.
      Remove both legacy keys; combinations are not translated automatically.
  - cops: Markdown/ReferenceDefinitions
    parameters: CheckUnused
    reason: 'Replace CheckUnused with Unused, preserving its boolean value (default: false).'
  - cops:
      - Markdown/CodeBlockStyle
      - Markdown/FenceStyle
      - Markdown/HeadingStyle
      - Markdown/OrderedListNumbering
      - Markdown/UnorderedListMarker
    parameters: EnforcedStyle
    alternative: Style
  - cops: Markdown/ListMarkerSpacing
    parameters:
      - OrderedSingle
      - OrderedMulti
      - UnorderedSingle
      - UnorderedMulti
    reason: >-
      Use Style (fixed or aligned) and MinSpaces instead.
      These settings now apply to all list items, regardless of marker type or multiline content.
      Different legacy spacing values cannot be preserved by a single policy; choose the desired shared spacing.
  - cops: Markdown/FirstHeading
    parameters:
      - TitleKey
    reason: >-
      Set FrontMatterTitle to the desired metadata key, or false to disable the front-matter title exemption.
