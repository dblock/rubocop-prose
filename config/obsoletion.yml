renamed:
  Markdown/HardTabs: Prose/HardTabs
  Markdown/ProperNames: Prose/ProperNames

changed_parameters:
  - cops: Markdown/StructuralLineLength
    parameters:
      - Max
      - HeadingMax
      - CodeBlockMax
    reason: >-
      Replace the shared limit and enable/value pairs with a positive integer width (or false) for each element:
      Headings, CodeBlocks, and Tables. For example, use Headings: 120, CodeBlocks: false, and Tables: false.
  - cops: Markdown/ListMarkerSpacing
    parameters:
      - OrderedSingle
      - OrderedMulti
      - UnorderedSingle
      - UnorderedMulti
    reason: >-
      Use EnforcedStyle (fixed or aligned) and MinSpaces instead.
      These settings now apply to all list items, regardless of marker type or multiline content.
      Different legacy spacing values cannot be preserved by a single policy; choose the desired shared spacing.
